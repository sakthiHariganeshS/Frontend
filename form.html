
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>

    
    <header>
        <h1>ABC College</h1>
        <p>Student Registration Portal</p>
    </header>

    
    <nav>
        <a href="#home">Home</a> |
        <a href="#registration">Registration</a> |
        <a href="#students">Registered Students</a>
    </nav>

    <main id="home">

        
        <section id="registration">
            <h2>Student Admission Form</h2>

            <form action="success.html" method="get"
                  autocomplete="on">

                <table border="1" cellpadding="8">

                    <tr>
                        <td>
                            <label for="sname">Student Name:</label>
                        </td>
                        <td>
                            <input type="text" id="sname"
                                   name="studentName"
                                   placeholder="Enter your name"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="email">Email:</label>
                        </td>
                        <td>
                            <input type="email" id="email"
                                   name="email"
                                   placeholder="Enter your email"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">Password:</label>
                        </td>
                        <td>
                            <input type="password" id="password"
                                   name="password"
                                   minlength="8" required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="dob">Date of Birth:</label>
                        </td>
                        <td>
                            <input type="date" id="dob"
                                   name="dob" required>
                        </td>
                    </tr>

                    <tr>
                        <td>Gender:</td>
                        <td>
        <input type="radio" id="male"
                  name="gender" value="Male" required>
    <label for="male">Male</label>

        <input type="radio" id="female"
                                   name="gender" value="Female">
    <label for="female">Female</label>

<input type="radio" id="other"
                                   name="gender" value="Other">
    <label for="other">Other</label>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="course">Course:</label>
                        </td>
                        <td>
     <select id="course" name="course" required>
        <option value="">Select a course</option>
         <option value="BCA">BCA</option>
            <option value="BSc CS">B.Sc. Computer Science</option>
    <option value="BCom">B.Com</option>
     <option value="BE CSE">B.E. Computer Science</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="center">
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                        </td>
                    </tr>

                </table>
            </form>
        </section>

        <!-- Registered Students Table -->
        <section id="students">
            <h2>Registered Students</h2>

            <table border="1" cellpadding="8">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>101</td>
                        <td>Arun Kumar</td>
                        <td>arun@example.com</td>
                        <td>BCA</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Priya</td>
                        <td>priya@example.com</td>
                        <td>B.Sc. Computer Science</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    
    <footer>
        <p>&copy; 2026 ABC College. All rights reserved.</p>
    </footer>

</body>
</html>
