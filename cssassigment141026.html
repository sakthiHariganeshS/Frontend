<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELATIVE</title>
    <style>
    div{
margin-top: 200px;
margin-left: 400px;
border: 2px solid black;
width:500px;
height:200px;
position: relative;
    }
    .rel{
        position: absolute;
        top: 50px;
        left: 5px;
    }
    .h{
        position: absolute;
        top: 1px;
        left: 120px;
    }
    .js{
        position: absolute;
        top: 1px;
        left: 250px;
    }
    .c{
        position: absolute;
        top: 50px;
        left: 400px;
    }
    .P{
        position: absolute;
        top: 100px;
        left: 120px;
    }
    .HT{
        position: absolute;
        top: 100px;
        left: 250px;
    }
    .css{
        position: absolute;
        top: 50px;
        left: 250px;
    }
    .grid{
        background-color: blueviolet;
    }
</style>
    </head>
    <body>
        <div class="grid">
        <h1 class="rel">Relative</h1>
        <h1 class="h">HEAD</h1>
        <h1 class="js">javascript</h1>
        <h1 class="c">C++</h1>
        <h1 class="P">PHP</h1>
        <h1 class="HT">HTML</h1>
        <h1 class="css"><></h1>
        </div>
        
    </body>
