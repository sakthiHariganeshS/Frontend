<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Event listener</title>

</head>
<body>
<button id="myButton">Click me</button>
<input type="text" id="myInput">
<div id="myDiv"></div>
<button>Click me</button>
    <div>
    <p>HI</p>
    <p>HEY
    </p>
    <p>
        BYE
    </p>
    </div>
</body>
<script>
    let btn=document.getElementById("myButton");
    btn.addEventListener("click",function(){
        console.log("Button clicked");
        if(btn.textContent=="Click me"){
        btn.textContent="Clicked";
    }
else{
    btn.textContent="Click me";
}
});
    btn.addEventListener("mouseover",function(){
        console.log("Mouse over");
    });
    let inp=document.getElementById("myInput");
    inp.addEventListener("focus",function(){
        console.log("Input focused");
    });
let d=document.getElementById("myDiv");
d.innerHTML+="<p> HI HI hi</p>";
 let a=document.getElementsByTagName('button')[0];
        a.addEventListener("click",function(){
            let bb=document.getElementsByTagName('div')[0];
            bb.firstElementChild.style.color='red';
            bb.lastElementChild.style.color='blue';
            bb.parentElement.style.backgroundColor='green';

        });

</script>
</html>
