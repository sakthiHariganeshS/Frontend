<!Doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EMCflex</title>
<style>
div{
    display:flex;
    background-color: blue;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap:5px;
}
h1{
    background-color: green;
    color:antiquewhite;
    marigin: 50px;
    padding: 20px;
    flex-basis:50px;
}
.ONE{
    flex-grow:1 ;
    
}
.TWO{
    flex-grow:2 ; 
}
    </style>
</head>
<body>
    <div>
<h1 class="ONE">ONE</h1>
<h1 class="TWO">TWO</h1>
<h1 class="THREE">THREE</h1>
<h1 class="FOUR">FOUR</h1>
<h1 class="FIVE">FIVE</h1>
<h1 class="SIX">SIX</h1>
<h1 class="SEVEN">SEVEN</h1>
<h1 class="EIGHT">EIGHT</h1>
<h1 class="NINE">NINE</h1>
<h1 class="TEN">TEN</h1>
    </div>

    
</body>
</html>
